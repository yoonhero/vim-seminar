<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Be Vim · Helvetica 비교</title><style>*{box-sizing:border-box}body{margin:0;background:#111;color:#e8e3d9;font:14px system-ui}main{max-width:1600px;margin:24px auto;padding:0 20px}h1{font-size:20px;font-weight:500}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button{background:none;border:1px solid #454545;color:inherit;padding:10px 15px;cursor:pointer}button[aria-pressed=true]{border-color:#e8e3d9;background:#282828}pre{margin:0;background:#000;font:clamp(4px,1.05vw,15px)/1.2 Menlo,Consolas,monospace;white-space:pre;overflow:auto}p{color:#aaa;line-height:1.7}input{width:100%;margin:16px 0}a{color:inherit}</style><main><h1>Be Vim · Helvetica Neue Medium</h1><p>동일한 글꼴 원형과 물고기 동작을 사용한 세 가지 배치. 제목도 이미지가 아닌 실제 ASCII 문자입니다.</p><nav><button data-mode="0">01 대각선 구도</button><button data-mode="1">02 같은 눈높이</button><button data-mode="2">03 중앙 타이틀</button><button id="pause">정지</button></nav><pre id="slide"></pre><input id="time" type="range" min="0" max="239" value="0" aria-label="재생 시점"><p id="description"></p><p><a href="comparison.png">세 가지 한 번에 보기</a> · 140 × 44 문자 · 20초</p></main><script>const data=__FRAME_DATA__;
let mode=0,tick=0,paused=false;
const descriptions=['왼쪽 위의 제목에서 오른쪽 아래의 물고기로 이어지는 대각선. 가장 넉넉한 유영 공간.','제목과 물고기를 같은 눈높이에 둔 구도. 제목은 7행, 물고기는 오른쪽 공간 전체를 사용.','중앙 타이틀 아래로 물고기가 모이는 구도. 제목은 9행, 부제도 중앙 정렬.'];
const slide=document.querySelector('#slide'),slider=document.querySelector('#time'),pause=document.querySelector('#pause');
const esc=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
function draw(){const [texts,colors]=data.frames[mode][tick];slide.innerHTML=texts.map((row,y)=>{let out='',run='',style=-1;const flush=()=>{if(run){const [fg,bg]=data.styles[style];out+=`<span style="color:${fg};background:${bg}">${esc(run)}</span>`;run=''}};[...row].forEach((c,x)=>{const next=colors[y].charCodeAt(x)-65;if(next!==style){flush();style=next}run+=c});flush();return out}).join('\n');slider.value=tick;document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.mode===mode));document.querySelector('#description').textContent=descriptions[mode]}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=+b.dataset.mode;draw()});pause.onclick=()=>{if(tick===239){tick=0;paused=false}else{paused=!paused}pause.textContent=paused?'재생':'정지';draw()};slider.oninput=()=>{tick=+slider.value;paused=true;pause.textContent='재생';draw()};setInterval(()=>{if(!paused){if(tick<239){tick++;draw()}else{paused=true;pause.textContent='다시 재생'}}},1000/12);draw();</script></html>
